<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERITAS — Build Log (From Scratch)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital@0;1&display=swap');

  :root{
    --paper: #ece3cd;
    --paper-dark: #ddd0ac;
    --paper-shadow: #c9b98a;
    --ink: #2b2620;
    --ink-soft: #5c5342;
    --stamp-red: #a3312a;
    --stamp-red-dim: #a3312a55;
    --folder-tab: #d9b877;
    --folder-tab-active: #e8c98a;
    --check-green: #45633f;
    --line: #b8a878;
    --highlight: #f4e9c9;
    --code-bg: #1e1b16;
    --code-fg: #e8dcc0;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, #00000012, transparent 60%),
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Libre Baskerville', Georgia, serif;
    padding:0 0 60px 0;
  }

  header{
    position:relative;
    padding:38px 24px 26px;
    text-align:center;
    border-bottom:3px double var(--ink-soft);
    background:var(--paper-dark);
  }
  header .case-no{
    font-family:'Courier Prime', monospace;
    font-size:12px;
    letter-spacing:2px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header h1{
    font-family:'Special Elite', 'Courier Prime', monospace;
    font-size:clamp(26px,5vw,40px);
    margin:8px 0 4px;
    letter-spacing:1px;
  }
  header .subtitle{
    font-family:'Courier Prime', monospace;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:1px;
  }
  .stamp{
    position:absolute; top:24px; right:28px;
    border:3px solid var(--stamp-red); color:var(--stamp-red);
    font-family:'Special Elite', monospace; font-size:14px;
    padding:6px 14px; transform:rotate(-8deg); border-radius:6px;
    letter-spacing:2px; opacity:0.85; background:#a3312a08;
  }
  .stamp.closed{ color:var(--check-green); border-color:var(--check-green); background:#45633f08; }

  .status-bar{ max-width:920px; margin:22px auto 0; padding:0 24px; }
  .status-bar .track{ height:14px; background:var(--paper-shadow); border:1px solid var(--ink-soft); border-radius:2px; overflow:hidden; }
  .status-bar .fill{ height:100%; background:repeating-linear-gradient(45deg, var(--check-green), var(--check-green) 6px, #3d5738 6px, #3d5738 12px); width:0%; transition:width .4s ease; }
  .status-bar .label{ font-family:'Courier Prime', monospace; font-size:12px; color:var(--ink-soft); margin-top:6px; display:flex; justify-content:space-between; }

  main{ max-width:920px; margin:32px auto; padding:0 24px; position:relative; z-index:1; }

  .week{ margin-bottom:22px; border:1px solid var(--line); background:var(--paper); box-shadow:2px 3px 0 var(--paper-shadow); }
  .week-header{ display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; background:var(--folder-tab); border-bottom:1px solid var(--line); user-select:none; }
  .week-header:hover{ background:var(--folder-tab-active); }
  .week-header .tab-num{ font-family:'Special Elite', monospace; font-size:20px; min-width:34px; }
  .week-header .tab-title{ flex:1; font-family:'Courier Prime', monospace; font-weight:700; font-size:14px; letter-spacing:0.5px; text-transform:uppercase; }
  .week-header .tab-goal{ display:block; font-family:'Libre Baskerville', serif; font-weight:400; font-style:italic; font-size:12px; text-transform:none; color:var(--ink-soft); margin-top:2px; }
  .week-header .tab-progress{ font-family:'Courier Prime', monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .week-header .chevron{ font-size:14px; transition:transform .2s ease; color:var(--ink-soft); }
  .week.open .chevron{ transform:rotate(90deg); }
  .week-body{ display:none; padding:6px 18px 18px; }
  .week.open .week-body{ display:block; }

  .day{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); }
  .day:first-child{ border-top:none; }
  .day-title{ font-family:'Courier Prime', monospace; font-size:13px; font-weight:700; color:var(--stamp-red); margin-bottom:8px; letter-spacing:0.5px; }

  ul.filelist{ list-style:none; margin:0 0 8px 0; padding-left:2px; }
  li.file{ margin-bottom:6px; line-height:1.4; }
  label.file-row{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:14px; }

  input[type=checkbox]{
    appearance:none; -webkit-appearance:none; width:17px; height:17px; min-width:17px;
    margin-top:2px; border:1.5px solid var(--ink-soft); background:var(--paper);
    position:relative; cursor:pointer; border-radius:2px;
  }
  input[type=checkbox]:checked{ background:var(--check-green); border-color:var(--check-green); }
  input[type=checkbox]:checked::after{ content:"✓"; position:absolute; top:-3px; left:2px; color:var(--highlight); font-size:13px; font-weight:bold; }

  .file-path{
    font-family:'Courier Prime', monospace; font-size:13px;
    background:var(--paper-dark); border:1px solid var(--line);
    padding:1px 6px; border-radius:3px;
  }
  .file-path.done{ text-decoration:line-through; color:var(--ink-soft); }

  details.skeleton{ margin:6px 0 14px 27px; }
  details.skeleton summary{
    font-family:'Courier Prime', monospace; font-size:11.5px; color:var(--ink-soft);
    cursor:pointer; letter-spacing:0.5px; padding:3px 0;
  }
  details.skeleton summary:hover{ color:var(--stamp-red); }
  details.skeleton pre{
    background:var(--code-bg); color:var(--code-fg);
    font-family:'Courier Prime', monospace; font-size:12px; line-height:1.5;
    padding:14px 16px; border-radius:4px; overflow-x:auto; margin:6px 0 0; white-space:pre;
  }

  .checkpoint{
    margin-top:12px; padding:10px 12px; border:1px dashed var(--stamp-red-dim);
    background:#a3312a0a; font-family:'Courier Prime', monospace; font-size:12.5px; color:var(--ink);
  }
  .checkpoint b{ color:var(--stamp-red); }

  footer{ max-width:920px; margin:10px auto 0; padding:14px 24px 0; text-align:center; font-family:'Courier Prime', monospace; font-size:11.5px; color:var(--ink-soft); }
  .reset-btn{ font-family:'Courier Prime', monospace; font-size:11px; background:none; border:1px solid var(--ink-soft); color:var(--ink-soft); padding:5px 10px; border-radius:3px; cursor:pointer; margin-top:10px; }
  .reset-btn:hover{ background:var(--paper-shadow); }

  @media (max-width:560px){
    .week-header{ flex-wrap:wrap; }
    .stamp{ position:static; display:inline-block; margin-top:12px; transform:rotate(-4deg); }
    details.skeleton{ margin-left:10px; }
  }
</style>
</head>

const STORAGE_KEY = "veritas_scratch_checklist_v1";

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveState(state){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let state = loadState();

function renderDay(day, wIdx, dIdx){
  let filesHtml = "";
  day.files.forEach((f, fIdx) => {
    const id = `w${wIdx}d${dIdx}f${fIdx}`;
    const checked = !!state[id];
    filesHtml += `<li class="file">
      <label class="file-row">
        <input type="checkbox" data-id="${id}">
        <span class="file-path ${checked ? "done" : ""}" data-textfor="${id}">${f}</span>
      </label>
    </li>`;
  });

  let skeletonHtml = "";
  if(day.code){
    skeletonHtml = `<details class="skeleton">
      <summary>▸ show skeleton</summary>
      <pre>${escapeHtml(day.code)}</pre>
    </details>`;
  }

  return `<div class="day">
    <div class="day-title">${day.title}</div>
    <ul class="filelist">${filesHtml}</ul>
    ${skeletonHtml}
  </div>`;
}

function renderWeek(week, wIdx){
  let daysHtml = "";
  week.days.forEach((day, dIdx) => { daysHtml += renderDay(day, wIdx, dIdx); });

  return `<div class="week" data-week="${wIdx}">
    <div class="week-header" data-toggle="${wIdx}">
      <span class="tab-num">${String(wIdx+1).padStart(2,'0')}</span>
      <span class="tab-title">${week.title}<span class="tab-goal">${week.goal}</span></span>
      <span class="tab-progress" id="wprog-${wIdx}">0/0</span>
      <span class="chevron">▶</span>
    </div>
    <div class="week-body">
      ${daysHtml}
      <div class="checkpoint"><b>CHECKPOINT —</b> ${week.checkpoint}</div>
    </div>
  </div>`;
}

function render(){
  const container = document.getElementById('weeksContainer');
  container.innerHTML = DATA.map((w,i) => renderWeek(w,i)).join("");

  container.querySelectorAll('.week-header').forEach(h => {
    h.addEventListener('click', () => { h.parentElement.classList.toggle('open'); });
  });

  container.querySelectorAll('input[type=checkbox]').forEach(cb => {
    const id = cb.getAttribute('data-id');
    cb.checked = !!state[id];
    cb.addEventListener('change', () => {
      state[id] = cb.checked;
      saveState(state);
      const textEl = container.querySelector(`[data-textfor="${id}"]`);
      if(textEl) textEl.classList.toggle('done', cb.checked);
      updateProgress();
    });
  });

  updateProgress();
  let openTarget = 0;
  for(let i=0;i<DATA.length;i++){
    const el = container.querySelector(`.week[data-week="${i}"]`);
    const boxes = el.querySelectorAll('input[type=checkbox]');
    const done = [...boxes].filter(b=>b.checked).length;
    if(done < boxes.length){ openTarget = i; break; }
    openTarget = i;
  }
  container.querySelectorAll('.week')[openTarget].classList.add('open');
}

function updateProgress(){
  const container = document.getElementById('weeksContainer');
  let totalAll = 0, doneAll = 0;
  DATA.forEach((w,i) => {
    const el = container.querySelector(`.week[data-week="${i}"]`);
    const boxes = el.querySelectorAll('input[type=checkbox]');
    const done = [...boxes].filter(b=>b.checked).length;
    totalAll += boxes.length; doneAll += done;
    const prog = document.getElementById(`wprog-${i}`);
    if(prog) prog.textContent = `${done}/${boxes.length}`;
  });
  const pct = totalAll ? Math.round((doneAll/totalAll)*100) : 0;
  document.getElementById('overallFill').style.width = pct + "%";
  document.getElementById('overallText').textContent = `${doneAll} / ${totalAll} files created`;
  document.getElementById('overallPct').textContent = pct + "%";
  const stamp = document.getElementById('stamp');
  if(pct >= 100){ stamp.textContent = "CASE CLOSED"; stamp.classList.add('closed'); }
  else { stamp.textContent = "IN PROGRESS"; stamp.classList.remove('closed'); }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm("Clear all checkmarks? This can't be undone.")){
    state = {}; saveState(state); render();
  }
});

render();
</script>
